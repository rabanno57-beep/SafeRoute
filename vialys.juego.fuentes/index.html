<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIALYS — Distracción Fatal | Simulador</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <a href="../index.html" title="Volver a Inicio VIALYS" style="display:flex;align-items:center;text-decoration:none;gap:6px;min-width:32px;">
      <img src="images/logo.png" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid #ffcc00;" alt="VIALYS">
      <span style="font-family:var(--pixel-font);font-size:7px;color:#ffcc00;letter-spacing:0.5px;">INICIO</span>
    </a>
    <div class="stat"><b id="distVal">0 m</b><span>Distancia</span></div>
    <div id="meterWrap"><div id="meterLabel">Atención al camino</div><div id="meterFill"></div></div>
    <div class="stat"><b id="clearedVal">0</b><span>Cerradas</span></div>
  </header>

  <div id="gameArea">
    <canvas id="road"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="controlsHint">◀ ▶ / A D para cambiar de carril</div>

    <div id="overlay"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
